name: 📱 Compilar APK (Android)

# Se ejecuta al subir cambios a main, al crear un tag v* (crea una Release
# con el APK adjunto) o manualmente desde la pestaña Actions.
on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Descargar el código
        uses: actions/checkout@v4

      - name: ☕ Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Los runners de GitHub ya traen el Android SDK instalado
      # (ANDROID_HOME viene configurado), no hace falta instalarlo.
      - name: 🤖 Comprobar Android SDK
        run: echo "SDK en $ANDROID_HOME" && ls "$ANDROID_HOME/platforms" && yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 🐘 Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 🔨 Compilar el APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: 📦 Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Gacha-Mod-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 🚀 Publicar Release con el APK (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Gacha Mod ${{ github.ref_name }}"
          body: |
            🌸 **Gacha Mod** — tipo Gacha Club / Gacha Life.
            Descarga `app-debug.apk`, ábrelo en tu Android e instálalo
            (acepta «Instalar apps desconocidas» si te lo pide).
          files: android/app/build/outputs/apk/debug/app-debug.apk
